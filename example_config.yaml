# Secrets may be supplied as ${ENVIRONMENT_VARIABLE} values.
settings:
  timeout: 10
  concurrency: 8
  state_file: ".certificate-monitor-state.json"

thresholds:
  warning_days: 30
  high_days: 15
  critical_days: 5

targets:
  - type: tls
    host: example.com
    port: 443
  - type: url
    url: "https://api.example.com/v1/health"
  - type: file
    path: "./certificates/*.pem"

notifications:
  console:
    enabled: true
  webhook:
    enabled: false
    url: "${CERT_WEBHOOK_URL}"
  email:
    enabled: false
    smtp_host: "smtp.example.com"
    smtp_port: 587
    username: "${SMTP_USER}"
    password: "${SMTP_PASS}"
    use_tls: true
    starttls: true
    from_addr: "alerts@example.com"
    to_addrs:
      - "admin@example.com"
      - "devops@example.com"
    subject_prefix: "[Cert Alert]"
