# Certificate Expiry Monitor Configuration

settings:
  timeout: 10
  concurrency: 8
  state_file: ".certificate-monitor-state.json"

thresholds:
  warning_days: 30
  high_days: 15
  critical_days: 5

targets:
  - type: url
    url: "https://expired.badssl.com"

notifications:
  console:
    enabled: true

  webhook:
    enabled: true
    url: "${CERT_WEBHOOK_URL}"

  email:
    enabled: false
    smtp_host: "${SMTP_HOST}"
    smtp_port: 587
    username: "${SMTP_USERNAME}"
    password: "${SMTP_PASSWORD}"
    from_addr: "${SMTP_FROM}"
    to_addrs:
      - "${ALERT_RECIPIENT}"

  sendgrid:
    enabled: true
    api_key: "${SENDGRID_API_KEY}"
    from_addr: "${SENDGRID_FROM}"
    to_addrs:
      - "${SENDGRID_RECIPIENT}"
